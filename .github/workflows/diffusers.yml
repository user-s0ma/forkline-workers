name: diffusers worker

on:
  push:
    branches: [main]
    paths: ["diffusers/**", ".github/workflows/diffusers.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyTorch と CUDA のイメージは大きいので、ビルド前に空き容量を作る
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: diffusers
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forkline-diffusers:latest
            ghcr.io/${{ github.repository_owner }}/forkline-diffusers:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Forkline generic Diffusers worker for RunPod Serverless
